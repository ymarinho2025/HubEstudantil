<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake Lógico</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#070a0d;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}.game{width:min(680px,96vw);text-align:center}.hud{font-size:24px;font-weight:800;margin:0 0 8px}
canvas{display:block;width:min(600px,90vw);height:auto;aspect-ratio:1;margin:auto;background:#050807;border:1px solid #183026;touch-action:none}
.help{font-size:13px;color:#9eb7aa;margin-top:8px}.over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0009;z-index:5}
.over div{background:#101817;border:1px solid #22c55e;padding:24px;border-radius:16px}.over strong{font-size:28px}
</style></head><body><main class="game"><div class="hud">PONTOS: <span id="score">0</span></div><canvas id="game" width="600" height="600"></canvas><div class="help">Setas do teclado ou clique/toque na região para onde deseja virar.</div></main><div class="over" id="over"><div><strong>Fim da rodada</strong><p>Responda à pergunta para continuar.</p></div></div><script src="./js/script.js"></script></body></html>
